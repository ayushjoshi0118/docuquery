name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: docuquery
          POSTGRES_PASSWORD: docuquery_secret
          POSTGRES_DB: docuquery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Alembic Migrations
        env:
          DATABASE_URL: postgresql+psycopg2://docuquery:docuquery_secret@localhost:5432/docuquery_test
        run: |
          cd backend
          alembic upgrade head

      - name: Run Pytest Suite
        env:
          PYTHONPATH: backend
          DATABASE_URL: sqlite:///:memory:
          CELERY_TASK_ALWAYS_EAGER: "True"
          STORAGE_BACKEND: "filesystem"
          EMBEDDING_PROVIDER: "mock"
          LLM_PROVIDER: "mock"
          SECRET_KEY: "ci-secret-key-32-chars-long-minimum-length"
        run: |
          python -m pytest backend/tests -v

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Tests
        run: |
          cd frontend
          npm test

      - name: Build Frontend Production Bundle
        run: |
          cd frontend
          npm run build
